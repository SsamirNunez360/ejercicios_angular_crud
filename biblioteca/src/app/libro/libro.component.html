<section class="container">
  <h2>Registros</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Código</th>
        <th>Nombre</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of registros">
        <td>{{ item.id }}</td>
        <td>{{ item.codigo }}</td>
        <td>{{ item.nombre }}</td>
      </tr>
    </tbody>
  </table>
</section>
