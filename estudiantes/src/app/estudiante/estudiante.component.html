<section class="container"><h2>Registros</h2><form (ngSubmit)="guardar()"><input [(ngModel)]="codigo" name="codigo" placeholder="Código"><input [(ngModel)]="nombre" name="nombre" placeholder="Nombre"><button type="submit">{{ editandoId === null ? 'Guardar' : 'Actualizar' }}</button><button type="button" (click)="nuevo()">Cancelar</button></form><p *ngIf="error">{{ error }}</p><table><thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let item of registros"><td>{{ item.id }}</td><td>{{ item.codigo }}</td><td>{{ item.nombre }}</td><td><button type="button" (click)="editar(item)">Editar</button></td></tr></tbody></table></section>
